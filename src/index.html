<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Smart Green – Arrosage intelligent et connecté</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Smart Green : un système d'arrosage intelligent et connecté qui ajuste l'irrigation à la météo et à votre terrain, pilotable depuis votre smartphone.">
  <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1f16" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Smart Green">
  <meta property="og:title" content="Smart Green – Arrosage intelligent et connecté">
  <meta property="og:description" content="Un système d'arrosage intelligent et connecté qui ajuste l'irrigation à la météo et à votre terrain.">
  <meta name="twitter:card" content="summary">

  <script>
    // Apply a remembered theme before the first paint (see src/app/shared/theme/theme.ts).
    try {
      var theme = localStorage.getItem('sg-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
