

<div class="section">
    <div class="frame frame-3-4 bg bg1">
        <div class="block">
            <div class="title">Newsletter</div>
            <form class="form" [formGroup]="newsletterForm" (ngSubmit)="submitNewsletter()" novalidate>
                <div class="input">
                    <label class="visually-hidden" for="newsletter-email">E-mail</label>
                    <input id="newsletter-email" type="email" placeholder="E-mail" formControlName="email"
                        autocomplete="email" [class.invalid]="isInvalid(newsletterForm.controls.email)"
                        [attr.aria-invalid]="isInvalid(newsletterForm.controls.email)"/>
                </div>
            </form>
        </div>
        <div class="block hide">
            <div class="title">Contactez nous</div>
            <form class="form" [formGroup]="contactForm" (ngSubmit)="submitContact()" novalidate>
                <div class="input">
                    <label class="visually-hidden" for="contact-name">NOM Prénom</label>
                    <input id="contact-name" type="text" placeholder="NOM Prénom" formControlName="name"
                        autocomplete="name" [class.invalid]="isInvalid(contactForm.controls.name)"
                        [attr.aria-invalid]="isInvalid(contactForm.controls.name)"/>
                </div>
                <div class="input">
                    <label class="visually-hidden" for="contact-email">E-mail</label>
                    <input id="contact-email" type="email" placeholder="E-mail" formControlName="email"
                        autocomplete="email" [class.invalid]="isInvalid(contactForm.controls.email)"
                        [attr.aria-invalid]="isInvalid(contactForm.controls.email)"/>
                </div>
                <div class="input">
                    <label class="visually-hidden" for="contact-message">Message</label>
                    <textarea id="contact-message" cols="30" rows="10" formControlName="message"
                        [class.invalid]="isInvalid(contactForm.controls.message)"
                        [attr.aria-invalid]="isInvalid(contactForm.controls.message)"></textarea>
                </div>
            </form>
        </div>
    </div>
    <div class="frame frame-1-4">
        <div class="text">
            <div class="p">
                <div class="line">Pour que vos plantes s'occupent d'elle même...</div>
                <div class="line">Restez toujours connecté avec Smart Green!</div>
                <div class="line">
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdXwlraiLyT74VFfF6ovCFwWBUsS933zJjoVAS9z7F6EW0GfA/viewform" class="btn">Exprimer votre avis</a>
                </div>
            </div>
        </div>
    </div>
</div>
