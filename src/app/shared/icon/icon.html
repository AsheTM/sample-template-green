<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="strokeWidth()"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @switch (name()) {
    @case ('arrow-right') {
      <path d="M5 12h14" />
      <path d="M13 6l6 6-6 6" />
    }
    @case ('chart') {
      <path d="M3 3v18h18" />
      <path d="M7 15l4-4 3 3 5-6" />
    }
    @case ('check') {
      <path d="M5 12l5 5 9-10" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    }
    @case ('close') {
      <path d="M6 6l12 12M18 6L6 18" />
    }
    @case ('droplet') {
      <path d="M12 2.7s6 6.4 6 11.3a6 6 0 0 1-12 0C6 9.1 12 2.7 12 2.7z" />
    }
    @case ('expand') {
      <path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" />
    }
    @case ('leaf') {
      <path d="M5 21c0-9 5-15 15-16-1 10-7 15-15 16z" />
      <path d="M5 21l8-8" />
    }
    @case ('mail') {
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="M3 7l9 6 9-6" />
    }
    @case ('menu') {
      <path d="M4 7h16M4 12h16M4 17h16" />
    }
    @case ('moon') {
      <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
    }
    @case ('phone') {
      <rect x="7" y="2" width="10" height="20" rx="2" />
      <path d="M11 18h2" />
    }
    @case ('rain') {
      <path d="M16 17H7a4 4 0 1 1 1-7.9A5 5 0 0 1 17.7 11 3 3 0 0 1 16 17z" />
      <path d="M8 20l1-1.5M12 21l1-1.5M16 20l1-1.5" />
    }
    @case ('sensor') {
      <circle cx="12" cy="12" r="2" />
      <path
        d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"
      />
    }
    @case ('sprout') {
      <path d="M12 21v-9" />
      <path d="M12 12c0-4 3-7 8-7 0 4-3 7-8 7z" />
      <path d="M12 14c0-3-2.5-5.5-7-5.5 0 3 2.5 5.5 7 5.5z" />
    }
    @case ('sun') {
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
      />
    }
    @case ('wifi') {
      <path d="M5 12.5a10 10 0 0 1 14 0" />
      <path d="M8.5 16a5 5 0 0 1 7 0" />
      <path d="M12 19.5h.01" />
    }
  }
</svg>
